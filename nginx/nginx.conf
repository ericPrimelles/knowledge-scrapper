worker_processes auto;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Compression
    gzip on;
    gzip_min_length 512;
    gzip_comp_level 1;
    gzip_types application/json application/javascript text/css text/plain text/xml;

    # Docker resolver (for ECS/DNS in Compose)
    resolver 127.0.0.11 ipv6=off;

    server {
        listen 80;
        server_name _;

        # Health check endpoint for ALB or Compose
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Main proxy
        location / {
            proxy_pass http://fastapi:3000;  # ✅ Docker Compose service name
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ✅ CORS Headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;

            # ✅ Handle preflight requests inside location block
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }
}
