version: '3.8'

services:
  fastapi:
    build: api/
    container_name: fastapi-app
    ports:
      - "8000:8000"  # ✅ Add this line
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi